name: Railway Deploy (Worker & Orchestrator)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            worker:
              - 'apps/worker/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            orchestrator:
              - 'apps/orchestrator/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'

      - name: Trigger Railway deploy (Worker)
        if: steps.changes.outputs.worker == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_WORKER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RAILWAY_WORKER_DEPLOY_HOOK not set; skipping"
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK"

      - name: Trigger Railway deploy (Orchestrator)
        if: steps.changes.outputs.orchestrator == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.RAILWAY_ORCHESTRATOR_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RAILWAY_ORCHESTRATOR_DEPLOY_HOOK not set; skipping"
            exit 0
          fi
          curl -fsSL -X POST "$DEPLOY_HOOK"

      - name: No service changed (log only)
        if: steps.changes.outputs.worker != 'true' && steps.changes.outputs.orchestrator != 'true'
        run: |
          echo "No changes in apps/worker or apps/orchestrator; nothing to deploy."


